\* expect: UnsentMeansUnsent
\* Recovery puts a started attempt back to pending, and a repeated key may dispatch it again.
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Procs = {p1, p2}
    MaxRestarts = 2
    ReturnExisting = FALSE
    ClaimRequiresPending = TRUE
    OneAttemptPerIntent = FALSE
    ClaimBeforePost = TRUE
    RecoverInFlightAsUnknown = FALSE
INVARIANTS TypeOK AtMostOnce UnsentMeansUnsent
