\* expect: AtMostOnce
\* Removes all three repeat guards: a repeated key returns the existing intent, the claim needs a pending intent, one attempt row per intent.
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Procs = {p1, p2}
    MaxRestarts = 2
    ReturnExisting = FALSE
    ClaimRequiresPending = FALSE
    OneAttemptPerIntent = FALSE
    ClaimBeforePost = TRUE
    RecoverInFlightAsUnknown = TRUE
INVARIANTS TypeOK AtMostOnce UnsentMeansUnsent
