name: verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      ios_hardware_send_tests:
        description: Run iOS HardwareSend UIKit tests on a standard Mac runner
        type: boolean
        required: false
        default: false
  workflow_call:

concurrency:
  # Main/release commits keep their own verification; only superseded PR runs cancel.
  # github.workflow separates a release caller from the normal verify run on the same SHA.
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCS_SITE_TEST: apps/docs/test/changelog-public-surfaces.test.ts

jobs:
  plan:
    name: plan tests and run small selections
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      docs-site: ${{ steps.plan.outputs.docs-site }}
      related: ${{ steps.plan.outputs.related }}
      android-native: ${{ steps.plan.outputs.android-native }}
      mobile: ${{ steps.plan.outputs.mobile }}
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --paginate
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100"
          --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv'
          > "$RUNNER_TEMP/changes.tsv"
      - id: plan
        run: node scripts/ci-plan.mjs --github --changes "$RUNNER_TEMP/changes.tsv"
      - id: select
        if: steps.plan.outputs.tests == 'affected'
        env:
          RELATED: ${{ steps.plan.outputs.related }}
        run: node scripts/ci-affected.mjs --select
      - name: Run small affected selection
        if: steps.select.outputs.shards == '1'
        run: node scripts/ci-affected.mjs --run
        env:
          TEST_FILES: ${{ toJSON(fromJSON(steps.select.outputs.matrix || '{"include":[{"files":[]}]}').include[0].files) }}

  static:
    name: lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: git diff --exit-code -- packages/computer/lib/client.js packages/computer/lib/client.js.map packages/browser/lib/client.js packages/browser/lib/client.js.map

  mobile-export:
    name: mobile verification (iOS and Android)
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botharness/mobile expo:doctor
      - run: pnpm --filter @botharness/mobile export
        env:
          CI: '1'
          EXPO_OFFLINE: '1'

  mobile-native:
    name: Android native module tests
    needs: plan
    if: needs.plan.outputs.android-native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botharness/mobile exec expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
      - run: bash apps/mobile/android/gradlew -p apps/mobile/android :stream-reveal:testDebugUnitTest :hardware-send:testDebugUnitTest :remote-keyboard:testDebugUnitTest :material-search:testDebugUnitTest :material-button-group:testDebugUnitTest :conversation-notifications:compileDebugKotlin :local-computer-video:compileDebugKotlin :lan-channel:testDebugUnitTest -PreactNativeArchitectures=x86_64 --max-workers=2 --console=plain

  mobile-native-ios:
    name: iOS HardwareSend UIKit tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.ios_hardware_send_tests
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
      BOTHARNESS_HARDWARE_SEND_IOS_TESTS: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the opt-in test specification
        working-directory: apps/mobile
        run: node node_modules/expo/bin/cli prebuild --platform ios --no-install
      - name: Install test host pods
        working-directory: apps/mobile/ios
        run: pod install --no-repo-update
      - name: Check the test scheme and select an installed simulator
        id: simulator
        run: |
          mkdir -p "$RUNNER_TEMP/hardware-send-ios"
          xcodebuild -version
          xcodebuild -list -json -workspace apps/mobile/ios/DeepSeekBotDev.xcworkspace > "$RUNNER_TEMP/hardware-send-ios/schemes.json"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          node <<'NODE'
          const fs = require('node:fs');
          const directory = `${process.env.RUNNER_TEMP}/hardware-send-ios`;
          const schemes = JSON.parse(fs.readFileSync(`${directory}/schemes.json`, 'utf8'));
          if (!schemes.workspace?.schemes?.includes('HardwareSend-Unit-Tests')) {
            throw new Error('Missing HardwareSend-Unit-Tests scheme');
          }
          const devices = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/available-simulators.json`, 'utf8'));
          const phones = Object.entries(devices.devices).flatMap(([runtime, entries]) =>
            /\.iOS-27(?:-|$)/.test(runtime)
              ? entries.filter((device) => device.isAvailable && device.name.startsWith('iPhone'))
                .map((device) => ({ runtime, name: device.name, udid: device.udid }))
              : []);
          phones.sort((a, b) => a.name.localeCompare(b.name) || a.udid.localeCompare(b.udid));
          if (!phones[0]) throw new Error('No installed and available iOS 27 phone simulator');
          fs.writeFileSync(`${directory}/simulator.json`, JSON.stringify(phones[0], null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${phones[0].udid}\n`);
          NODE
      - name: Prove ordinary command delivery before composition regressions
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild test \
            -workspace apps/mobile/ios/DeepSeekBotDev.xcworkspace \
            -scheme HardwareSend-Unit-Tests -configuration Debug -sdk iphonesimulator \
            -destination "id=$SIMULATOR_ID" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/hardware-send-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/hardware-send-ios/positive.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -jobs 2 \
            -only-testing:HardwareSend-Unit-Tests/HardwareSendViewTests/testOrdinaryCommandReturnSendsThroughTheResponderChain \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/hardware-send-ios/positive.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/hardware-send-ios/positive.xcresult" --compact > "$RUNNER_TEMP/hardware-send-ios/positive-summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/hardware-send-ios/positive.xcresult" --compact > "$RUNNER_TEMP/hardware-send-ios/positive-tests.json"
          node apps/mobile/scripts/check-hardware-send-ios-results.mjs positive "$RUNNER_TEMP/hardware-send-ios/positive-summary.json" "$RUNNER_TEMP/hardware-send-ios/positive-tests.json"
      - name: Exercise marked text and stale command actions
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild test-without-building \
            -workspace apps/mobile/ios/DeepSeekBotDev.xcworkspace \
            -scheme HardwareSend-Unit-Tests -configuration Debug -sdk iphonesimulator \
            -destination "id=$SIMULATOR_ID" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/hardware-send-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/hardware-send-ios/regressions.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:HardwareSend-Unit-Tests/HardwareSendViewTests/testCachedCommandDoesNotSendMarkedTextAndNextCommandStillWorks \
            -only-testing:HardwareSend-Unit-Tests/HardwareSendViewTests/testCachedCommandCannotSendAfterFocusLeavesTheComposer \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/hardware-send-ios/regressions.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/hardware-send-ios/regressions.xcresult" --compact > "$RUNNER_TEMP/hardware-send-ios/regressions-summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/hardware-send-ios/regressions.xcresult" --compact > "$RUNNER_TEMP/hardware-send-ios/regressions-tests.json"
          node apps/mobile/scripts/check-hardware-send-ios-results.mjs regressions "$RUNNER_TEMP/hardware-send-ios/regressions-summary.json" "$RUNNER_TEMP/hardware-send-ios/regressions-tests.json"
      - name: Retain only synthetic HardwareSend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-send-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hardware-send-ios/positive.log
            ${{ runner.temp }}/hardware-send-ios/regressions.log
            ${{ runner.temp }}/hardware-send-ios/positive.xcresult
            ${{ runner.temp }}/hardware-send-ios/regressions.xcresult
            ${{ runner.temp }}/hardware-send-ios/*-summary.json
            ${{ runner.temp }}/hardware-send-ios/*-tests.json
            ${{ runner.temp }}/hardware-send-ios/schemes.json
            ${{ runner.temp }}/hardware-send-ios/simulator.json
          if-no-files-found: ignore
          retention-days: 7

  test-full:
    name: test (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.tests == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --exclude "$DOCS_SITE_TEST" --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test-affected:
    name: test (affected shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.shards == '3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-affected.mjs --run
        env:
          TEST_FILES: ${{ toJSON(matrix.files) }}

  docs-site:
    name: docs site build
    needs: plan
    if: needs.plan.outputs.docs-site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm slides:build
      - run: pnpm vitest run "$DOCS_SITE_TEST"

  e2e-smoke:
    name: e2e smoke (isolated DSH Host)
    needs: plan
    if: needs.plan.outputs.tests != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:smoke

  verify:
    name: lint, format, typecheck, test, build, docs
    needs:
      [
        plan,
        static,
        mobile-export,
        mobile-native,
        mobile-native-ios,
        test-full,
        test-affected,
        docs-site,
        e2e-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          IOS_HARDWARE_SEND_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_hardware_send_tests }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const plan = needs.plan.outputs;
          const required = ['plan', 'static'];
          if (process.env.IOS_HARDWARE_SEND_TESTS === 'true') required.push('mobile-native-ios');
          if (plan.mobile === 'true') required.push('mobile-export');
          if (plan['android-native'] === 'true') required.push('mobile-native');
          if (plan['docs-site'] === 'true') required.push('docs-site');
          if (plan.tests !== 'none') required.push('e2e-smoke');
          if (plan.tests === 'full') required.push('test-full');
          if (plan.tests === 'affected') {
            const count = plan.count;
            const shards = plan.shards;
            if (!/^\d+$/.test(count ?? '')) throw new Error('Missing affected test count');
            if (!['0', '1', '3'].includes(shards) ||
                (Number(count) === 0) !== (shards === '0')) throw new Error('Invalid affected test shards');
            if (shards === '3') required.push('test-affected');
          }
          if (!['none', 'affected', 'full'].includes(plan.tests) ||
              !['true', 'false'].includes(plan.mobile)) throw new Error('Invalid CI plan');
          const failed = Object.entries(needs).filter(([, job]) => !['success', 'skipped'].includes(job.result));
          const missing = required.filter((name) => needs[name]?.result !== 'success');
          if (failed.length || missing.length) {
            console.error('Verification failed', { failed: failed.map(([name]) => name), missing });
            process.exit(1);
          }
          NODE
