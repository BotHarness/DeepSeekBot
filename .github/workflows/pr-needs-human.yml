name: human merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-needs-human-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    name: label PRs requiring a human merge
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .node-version
            scripts/check-needs-human.mjs
            scripts/ci-plan.mjs
            scripts/dev-package-manager.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-needs-human.mjs
