name: pr body

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    name: issue reference, merge risk and verification
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/check-pr-body.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          node scripts/check-pr-body.mjs --title "$TITLE" --author "$AUTHOR" --body-file "$RUNNER_TEMP/body.md"
