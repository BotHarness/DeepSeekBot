name: pr body

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    name: issue reference, merge risk and verification
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/check-pr-body.mjs
            scripts/pr-body-field.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          node scripts/check-pr-body.mjs --title "$TITLE" --author "$AUTHOR" --body-file "$RUNNER_TEMP/body.md"

  pr-visual-evidence:
    name: pr-visual-evidence
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/check-pr-visual-evidence.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          gh pr diff "$PR_NUMBER" --name-only > "$RUNNER_TEMP/files.txt"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          node scripts/check-pr-visual-evidence.mjs --title "$TITLE" --author "$AUTHOR" --body-file "$RUNNER_TEMP/body.md" --files-file "$RUNNER_TEMP/files.txt" --labels "$LABELS"
