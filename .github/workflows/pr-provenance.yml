name: pr provenance

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    name: harness and model labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .node-version
            scripts/check-pr-provenance.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: node scripts/check-pr-provenance.mjs
