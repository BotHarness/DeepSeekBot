name: provenance

on:
  pull_request_target:
    types: [opened, edited, reopened, labeled, unlabeled]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: provenance-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  labels:
    name: harness and model labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .node-version
            scripts/check-pr-provenance.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-provenance.mjs
