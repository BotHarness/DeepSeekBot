<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: how should a Bot's Sessions sub panel show status, goal and
  to-do progress, and how should one Session open in a detail sub panel inside the message panel
  instead of jumping to DeepSeek Harness?
  Three variants on one page, switchable with ?variant=A|B|C and ?theme=light|dark.
  Colours, radii, type sizes and spacing come from packages/client/src/client/ds/tobs-tokens.generated.ts
  (style "a") and ds/tokens.stylex.ts. Data is fixture data shaped after the real sources:
  OwnedSessionSummary + AssignmentWork (Host), and the DSH `goal` / `todos` session projections.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session panel prototype</title>
    <style>
      :root,
      [data-theme='light'] {
        --tobs-layer-canvas: #ffffff;
        --tobs-layer-raised: #f4f5f7;
        --tobs-layer-well: #eceef1;
        --tobs-layer-field: #ffffff;
        --tobs-layer-nav: #f8f9fa;
        --tobs-layer-sheet: #ffffff;
        --tobs-layer-elevated: #ffffff;
        --tobs-ink-primary: #111318;
        --tobs-ink-secondary: #5c626a;
        --tobs-ink-tertiary: #676c74;
        --tobs-ink-quiet: #80858d;
        --tobs-ink-disabled: #b4b8be;
        --tobs-line-divider: #00000012;
        --tobs-line-edge: #0000001c;
        --tobs-line-strong: #0000002e;
        --tobs-state-hover: #1d27380d;
        --tobs-state-pressed: #1d273817;
        --tobs-state-selected: #e6e9ee;
        --tobs-status-danger-base: #d0302c;
        --tobs-status-danger-tint: #fdeeed;
        --tobs-status-danger-ink: #b0241f;
        --tobs-status-warning-base: #d98a00;
        --tobs-status-warning-tint: #fff4e0;
        --tobs-status-warning-ink: #8a5300;
        --tobs-status-success-base: #1f9d55;
        --tobs-status-success-tint: #e6f6ec;
        --tobs-status-success-ink: #157a41;
        --tobs-status-info-base: #3466db;
        --tobs-status-info-tint: #ebf0fb;
        --tobs-status-info-ink: #3061d6;
        --tobs-accent-solid: #3466db;
        --tobs-accent-on-solid: #ffffff;
        --tobs-accent-tint: #ebf0fb;
        --tobs-accent-ink: #3061d6;
        --tobs-elevation-2: 0 1px 2px #0000000f, 0 6px 16px -4px #00000024;
        --bot: #c2410c;
      }
      [data-theme='dark'] {
        --tobs-layer-canvas: #1b1c1f;
        --tobs-layer-raised: #242529;
        --tobs-layer-well: #2c2d32;
        --tobs-layer-field: #16171a;
        --tobs-layer-nav: #17181a;
        --tobs-layer-sheet: #1f2023;
        --tobs-layer-elevated: #303237;
        --tobs-ink-primary: #f2f3f5;
        --tobs-ink-secondary: #a8adb5;
        --tobs-ink-tertiary: #979ca5;
        --tobs-ink-quiet: #868b94;
        --tobs-ink-disabled: #5a5e65;
        --tobs-line-divider: #ffffff10;
        --tobs-line-edge: #ffffff1f;
        --tobs-line-strong: #ffffff30;
        --tobs-state-hover: #ffffff0d;
        --tobs-state-pressed: #ffffff17;
        --tobs-state-selected: #2f3136;
        --tobs-status-danger-base: #ff7a72;
        --tobs-status-danger-tint: #3b2120;
        --tobs-status-danger-ink: #ff9b94;
        --tobs-status-warning-base: #f2b33d;
        --tobs-status-warning-tint: #3a2d14;
        --tobs-status-warning-ink: #f6c770;
        --tobs-status-success-base: #45c97c;
        --tobs-status-success-tint: #173324;
        --tobs-status-success-ink: #7ad9a1;
        --tobs-status-info-base: #78a0ff;
        --tobs-status-info-tint: #2c3447;
        --tobs-status-info-ink: #78a0ff;
        --tobs-accent-solid: #78a0ff;
        --tobs-accent-on-solid: #0d1220;
        --tobs-accent-tint: #2c3447;
        --tobs-accent-ink: #78a0ff;
        --tobs-elevation-2: 0 0 0 1px #ffffff12, 0 8px 20px -4px #00000080;
        --bot: #fb923c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          13px/20px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Noto Sans SC',
          'Noto Sans CJK SC',
          sans-serif;
        color: var(--tobs-ink-primary);
        background: var(--tobs-layer-nav);
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .app {
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 100%;
        height: 100vh;
        gap: 0;
      }
      /* left channel rail (context only) */
      .rail {
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .rail h4 {
        margin: 8px 8px 4px;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--tobs-ink-tertiary);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        color: var(--tobs-ink-secondary);
      }
      .nav.sel {
        background: var(--tobs-state-selected);
        color: var(--tobs-ink-primary);
        font-weight: 500;
      }
      .ava {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--bot);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        flex: none;
      }
      /* workspace */
      .ws {
        display: flex;
        gap: 8px;
        padding: 8px 8px 8px 0;
        min-width: 0;
        min-height: 0;
      }
      .panel {
        background: var(--tobs-layer-canvas);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .panel.msg {
        flex: 1 1 0;
      }
      .panel.sessions {
        flex: 0 0 340px;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 12px 0 16px;
        flex: none;
      }
      .ph .t {
        font-weight: 500;
        font-size: 13px;
      }
      .ph .sp {
        flex: 1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        background: var(--tobs-layer-raised);
        color: var(--tobs-ink-secondary);
        font-size: 12px;
        white-space: nowrap;
      }
      .ib {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: inline-grid;
        place-items: center;
        color: var(--tobs-ink-secondary);
        flex: none;
      }
      .ib:hover {
        background: var(--tobs-state-hover);
      }
      .ib.sm {
        width: 24px;
        height: 24px;
      }
      svg.i {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      svg.i.s14 {
        width: 14px;
        height: 14px;
      }
      /* message split (same shape as .bh-message-split with the members/inbox aside) */
      .split {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .conv {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .msgs {
        flex: 1;
        overflow: auto;
        padding: 8px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .m {
        display: flex;
        gap: 10px;
        max-width: 640px;
      }
      .m.me {
        align-self: flex-end;
      }
      .bubble {
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--tobs-layer-raised);
      }
      .m.me .bubble {
        background: var(--tobs-accent-tint);
      }
      .m .who {
        font-size: 12px;
        line-height: 16px;
        color: var(--tobs-ink-tertiary);
        margin-bottom: 2px;
      }
      .composer {
        margin: 0 16px 16px;
        border-radius: 14px;
        background: var(--tobs-layer-raised);
        padding: 10px 12px;
        color: var(--tobs-ink-quiet);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .divider {
        width: 8px;
        flex: none;
        cursor: col-resize;
        position: relative;
      }
      .divider::after {
        content: '';
        position: absolute;
        inset: 12px 3px;
        border-radius: 2px;
        background: var(--tobs-line-divider);
      }
      .aside {
        flex: 0 0 48%;
        max-width: 560px;
        min-width: 360px;
        display: flex;
        flex-direction: column;
        background: var(--tobs-layer-canvas);
        min-height: 0;
      }
      .body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      /* group headings */
      .gh {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 16px;
        margin-top: 8px;
        font-size: 12px;
        line-height: 16px;
        color: var(--tobs-ink-tertiary);
        font-weight: 500;
      }
      .gh .n {
        color: var(--tobs-ink-quiet);
        font-weight: 400;
      }
      .gh svg {
        width: 12px;
        height: 12px;
      }
      /* ---------- status glyph (shape + colour, never colour alone) ---------- */
      .glyph {
        width: 18px;
        height: 18px;
        flex: none;
        display: inline-grid;
        place-items: center;
      }
      .glyph svg {
        width: 18px;
        height: 18px;
      }
      .g-working {
        color: var(--tobs-status-info-base);
      }
      .g-working .spin {
        transform-origin: 50% 50%;
        animation: spin 1.6s linear infinite;
      }
      .g-needs {
        color: var(--tobs-status-warning-base);
      }
      .g-error {
        color: var(--tobs-status-danger-base);
      }
      .g-stuck {
        color: var(--tobs-status-warning-base);
      }
      .g-idle {
        color: var(--tobs-ink-quiet);
      }
      .g-done {
        color: var(--tobs-status-success-base);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .g-working .spin {
          animation: none;
        }
      }
      /* tags */
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 6px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        font-weight: 500;
      }
      .tag.warning {
        background: var(--tobs-status-warning-tint);
        color: var(--tobs-status-warning-ink);
      }
      .tag.danger {
        background: var(--tobs-status-danger-tint);
        color: var(--tobs-status-danger-ink);
      }
      .tag.info {
        background: var(--tobs-status-info-tint);
        color: var(--tobs-status-info-ink);
      }
      .tag.success {
        background: var(--tobs-status-success-tint);
        color: var(--tobs-status-success-ink);
      }
      .tag.quiet {
        background: var(--tobs-layer-raised);
        color: var(--tobs-ink-secondary);
        font-weight: 400;
      }
      /* ---------- Variant A rows: Claude-like thread rows ---------- */
      .rowA {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        column-gap: 10px;
        row-gap: 2px;
        padding: 8px 16px;
        cursor: pointer;
        position: relative;
        border-radius: 0;
      }
      .rowA:hover {
        background: var(--tobs-state-hover);
      }
      .rowA.sel {
        background: var(--tobs-state-selected);
      }
      .rowA .glyph {
        grid-row: 1;
        margin-top: 3px;
      }
      .rowA .rail-line {
        grid-column: 1;
        grid-row: 2 / span 2;
        justify-self: center;
        width: 1px;
        background: var(--tobs-line-edge);
        margin: 2px 0;
      }
      .rowA .title {
        grid-column: 2;
        font-weight: 500;
        font-size: 14px;
        line-height: 22px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rowA .time {
        grid-column: 3;
        font-size: 12px;
        color: var(--tobs-ink-quiet);
        line-height: 22px;
      }
      .rowA .line {
        grid-column: 2 / span 2;
        color: var(--tobs-ink-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rowA .chips {
        grid-column: 2 / span 2;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .prog {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        background: var(--tobs-layer-raised);
        font-size: 12px;
        color: var(--tobs-ink-secondary);
      }
      .ring {
        width: 14px;
        height: 14px;
      }
      .goalchip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        background: var(--tobs-layer-raised);
        font-size: 12px;
        color: var(--tobs-ink-secondary);
        max-width: 100%;
        overflow: hidden;
      }
      .goalchip span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* ---------- Variant B rows: cards with goal + progress bar ---------- */
      .listB {
        padding: 4px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cardB {
        background: var(--tobs-layer-raised);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
      }
      .cardB:hover {
        background: color-mix(in srgb, var(--tobs-ink-primary) 6%, var(--tobs-layer-raised));
      }
      .cardB.sel {
        box-shadow: inset 0 0 0 2px var(--tobs-accent-solid);
      }
      .cardB .top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .cardB .title {
        flex: 1;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cardB .goal {
        color: var(--tobs-ink-secondary);
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .cardB .goal span {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .cardB .now {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--tobs-ink-tertiary);
        font-size: 12px;
        line-height: 16px;
        min-width: 0;
      }
      .cardB .now span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--tobs-layer-well);
        overflow: hidden;
        flex: 1;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--tobs-accent-solid);
        border-radius: 2px;
      }
      .bar.done i {
        background: var(--tobs-status-success-base);
      }
      .barrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--tobs-ink-secondary);
        font-variant-numeric: tabular-nums;
      }
      /* orchestrator strip */
      .orch {
        margin: 4px 12px 4px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--tobs-layer-raised);
        display: grid;
        grid-template-columns: 20px 1fr auto;
        gap: 2px 10px;
        cursor: pointer;
      }
      .orch.sel {
        box-shadow: inset 0 0 0 2px var(--tobs-accent-solid);
      }
      .orch .ava {
        grid-row: span 2;
        margin-top: 1px;
      }
      .orch .title {
        font-weight: 500;
      }
      .orch .line {
        display: flex;
        align-items: center;
        gap: 4px;
        grid-column: 2 / span 2;
        color: var(--tobs-ink-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        line-height: 16px;
      }
      .cap {
        font-size: 12px;
        color: var(--tobs-ink-quiet);
        font-variant-numeric: tabular-nums;
      }
      /* ---------- detail ---------- */
      .dh {
        padding: 4px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dh h2 {
        margin: 0;
        font-size: 15px;
        line-height: 24px;
        font-weight: 500;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        color: var(--tobs-ink-tertiary);
        font-size: 12px;
        line-height: 16px;
        align-items: center;
      }
      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .sec {
        margin: 0 12px 12px;
        border-radius: 10px;
        background: var(--tobs-layer-raised);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sec h3 {
        margin: 0;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--tobs-ink-tertiary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sec h3 .sp {
        flex: 1;
      }
      .sec.attn {
        background: var(--tobs-status-warning-tint);
      }
      .sec.attn h3 {
        color: var(--tobs-status-warning-ink);
      }
      .objective {
        font-size: 14px;
        line-height: 22px;
      }
      .todos {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .todos li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 3px 0;
      }
      .todos li .ck {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        flex: none;
      }
      .todos li.completed {
        color: var(--tobs-ink-tertiary);
      }
      .todos li.completed .txt {
        text-decoration: line-through;
        text-decoration-color: var(--tobs-ink-quiet);
      }
      .todos li.in_progress .txt {
        font-weight: 500;
      }
      .ck-done {
        color: var(--tobs-status-success-base);
      }
      .ck-run {
        color: var(--tobs-status-info-base);
      }
      .ck-pend {
        color: var(--tobs-ink-quiet);
      }
      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: color-mix(in srgb, var(--tobs-ink-primary) 8%, var(--tobs-layer-raised));
        font-weight: 500;
      }
      .btn.primary {
        background: var(--tobs-accent-solid);
        color: var(--tobs-accent-on-solid);
      }
      .sec.attn .btn:not(.primary) {
        background: color-mix(in srgb, var(--tobs-ink-primary) 8%, var(--tobs-status-warning-tint));
      }
      .report {
        white-space: pre-wrap;
      }
      .tl {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .tl li {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        gap: 8px;
        padding: 4px 0;
        align-items: start;
      }
      .tl .tool {
        font-size: 12px;
        color: var(--tobs-ink-quiet);
      }
      .tl time {
        font-size: 12px;
        color: var(--tobs-ink-quiet);
        font-variant-numeric: tabular-nums;
      }
      .instr {
        margin: 0;
        padding: 8px 12px;
        border-left: 2px solid var(--tobs-accent-solid);
        border-radius: 4px;
        background: var(--tobs-layer-canvas);
        white-space: pre-wrap;
      }
      .instr b {
        display: block;
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
        color: var(--tobs-ink-tertiary);
      }
      .foot {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        align-items: center;
        flex: none;
      }
      .foot .sp {
        flex: 1;
      }
      .linkbtn {
        color: var(--tobs-ink-secondary);
        display: inline-flex;
        gap: 6px;
        align-items: center;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
      }
      .linkbtn:hover {
        background: var(--tobs-state-hover);
      }
      .subrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
      }
      .subrow .t {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        color: var(--tobs-ink-tertiary);
        padding: 40px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;

          .map((t) => {
            const cls =
              t.status === 'completed'
                ? 'ck-done'
                : t.status === 'in_progress'
                  ? 'ck-run'
                  : 'ck-pend';
            const g =
              t.status === 'completed'
                ? GLYPH.done
                : t.status === 'in_progress'
                  ? GLYPH.working
                  : GLYPH.idle;
            const lab = { completed: '已完成', in_progress: '进行中', pending: '未开始' }[t.status];
            return `<li class="${t.status}"><span class="ck ${cls} ${t.status === 'in_progress' ? 'g-working' : ''}" role="img" aria-label="${lab}">${g.replace('<svg', '<svg width="16" height="16"')}</span><span class="txt">${t.content}</span></li>`;
          })
          .join('')}</ul>`;
      }
      function detail(s, { drill = false } = {}) {
        if (!s) return '';
        const { done, total } = count(s);
        const stateTag = `<span class="tag ${s.state === 'needs' ? 'warning' : STATE[s.state].tone}">${stateLabel(s)}</span>`;
        const head = `<div class="ph">
      ${drill ? `<button class="ib" aria-label="返回会话列表" data-back>${ic('back')}</button>` : ''}
      <span class="t">${s.role === 'orchestrator' ? 'Orchestrator' : 'Assignment'}</span><span class="sp"></span>
      <button class="ib" aria-label="在 DeepSeek Harness 中打开" title="在 DeepSeek Harness 中打开">${ic('ext')}</button>
      <button class="ib" aria-label="更多">${ic('menu')}</button>
      ${drill ? '' : `<button class="ib" aria-label="关闭" data-close>${ic('x')}</button>`}
    </div>`;
        const header = `<div class="dh">
      <div style="display:flex;gap:8px;align-items:center">${glyph(s.state, stateLabel(s))}<h2>${s.title}</h2></div>
      <div class="meta">${stateTag}<span>${ic('folder', 's14')}${s.workspace}</span><span>${ic('cpu', 's14')}${s.model}</span><span>${ic('clock', 's14')}${s.time}</span></div>
      ${s.description ? `<div style="color:var(--tobs-ink-secondary)">${s.description}</div>` : ''}
    </div>`;
        let attn = '';
        if (s.state === 'needs' && s.need === 'approval')
          attn = `<div class="sec attn"><h3>${ic('shield', 's14')}等待你审批 · ${s.approval.tool}</h3>
      <code style="font:12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap">${s.approval.command}</code>
      <div class="btns"><button class="btn primary">${ic('check', 's14')}允许</button><button class="btn">本会话都允许</button><button class="btn">拒绝</button></div></div>`;
        if (s.state === 'needs' && s.need === 'question')
          attn = `<div class="sec attn"><h3>${ic('msg', 's14')}等你回复</h3><div>「语音输入」要不要算这次的亮点？还是放到「其他改进」里？</div>
      <div class="btns"><button class="btn primary">算亮点</button><button class="btn">放到其他改进</button><button class="btn">回复…</button></div></div>`;
        if (s.state === 'stuck')
          attn = `<div class="sec attn"><h3>${ic('clock', 's14')}18 分钟没有新进展</h3><div>最后一步是 <code>pnpm build</code>，还在运行。</div>
      <div class="btns"><button class="btn">让 Tobs 去问一下</button><button class="btn">${ic('stop', 's14')}停止</button></div></div>`;
        const goal = s.goal
          ? `<div class="sec"><h3>${ic('target', 's14')}目标<span class="sp"></span><span class="tag ${s.goal.phase === 'complete' ? 'success' : 'info'}">${s.goal.phase === 'complete' ? '已达成' : '进行中'}</span></h3>
      <div class="objective">${s.goal.objective}</div>
      <div class="meta"><span>第 ${s.goal.rounds} 轮 · 上限 ${s.goal.max}</span></div></div>`
          : '';
        const todos = total
          ? `<div class="sec"><h3>${ic('list', 's14')}任务<span class="sp"></span><span style="font-variant-numeric:tabular-nums">${done}/${total}</span></h3>
      <div class="bar ${done === total ? 'done' : ''}" style="flex:none"><i style="width:${(done / total) * 100}%"></i></div>
      ${todoList(s)}</div>`
          : '';
        const subs =
          s.subagents && s.subagents.length
            ? `<div class="sec"><h3>${ic('users', 's14')}Subagents</h3>${s.subagents.map((a) => `<div class="subrow">${glyph('working', '运行中')}<span class="t">${a.title}</span><span class="tag info">运行中</span></div>`).join('')}</div>`
            : '';
        let activity = '';
        if (s.rounds)
          activity = s.rounds
            .map(
              (r) => `<div class="sec"><h3>第 ${r.index} 轮 · ${r.kind} · ${r.at}</h3>
      <blockquote class="instr"><b>Tobs 的指示</b>${r.instruction}</blockquote>
      <ul class="tl">${r.steps.map(([st, d, tool, at]) => `<li>${st === 'done' ? `<span class="ck-done">${ic('check', 's14')}</span>` : `<span class="g-working glyph" style="width:14px;height:14px">${GLYPH.working}</span>`}<span><div>${d}</div><div class="tool">${tool}</div></span><time>${at}</time></li>`).join('')}</ul></div>`,
            )
            .join('');
        else if (s.role === 'orchestrator') {
          const a = SESSIONS.filter((x) => x.role === 'assignment' && x.state !== 'done');
          activity = `<div class="sec"><h3>${ic('sessions', 's14')}正在管理的 Assignment · ${a.length}</h3>${a
            .map((x) => {
              const c = count(x);
              return `<div class="subrow" data-open="${x.id}" style="cursor:pointer">${glyph(x.state, stateLabel(x))}<span class="t">${x.title}</span>${c.total ? `<span class="cap">${c.done}/${c.total}</span>` : ''}</div>`;
            })
            .join('')}</div>`;
        } else activity = `<div class="sec"><h3>最新动态</h3><div>${s.line}</div></div>`;
        const foot = `<div class="foot">
      ${s.state === 'working' || s.state === 'stuck' ? `<button class="btn">${ic('stop', 's14')}停止</button>` : ''}
      ${s.state === 'done' || s.state === 'idle' ? `<button class="btn">${ic('archive', 's14')}${s.state === 'done' ? '取消归档' : '归档'}</button>` : ''}
      <span class="sp"></span>
      <button class="linkbtn">${ic('ext', 's14')}在 DeepSeek Harness 中打开</button></div>`;
        return `${head}<div class="body">${header}${attn}${goal}${todos}${subs}${activity}</div>${foot}`;
      }

      /* ---------- page ---------- */
      const CURVE_DOWN =
        '<svg class="curve" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 0v4a8 8 0 0 0 8 8h8"/></svg>';
      const CURVE_UP =
        '<svg class="curve" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 14v-4a8 8 0 0 1 8-8h8"/></svg>';
      function linkRow(id, dir, verb) {
        const x = byId[id],
          c = count(x);
        return `<div class="slink ${dir}" data-open="${id}" role="button" tabindex="0">${dir ? (dir === 'down' ? CURVE_DOWN : CURVE_UP) : ''}<span class="verb">${verb}</span>${glyph(x.state, stateLabel(x))}<span class="name">${x.title}</span>${c.total ? `<span class="cnt">${c.done}/${c.total}</span>` : ''}${x.state === 'needs' ? `<span class="tag warning">${NEED[x.need]}</span>` : ''}</div>`;
      }
      const PLUS =
        '<svg class="i s14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
      const FWD =
        '<svg class="i s14" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 17 5-5-5-5"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg>';
      function innerRow(id, dir) {
        const x = byId[id],
          c = count(x);
        return `<div class="ilink ${dir}" data-open="${id}" role="button" tabindex="0">${dir === 'down' ? CURVE_DOWN : CURVE_UP}${glyph(x.state, stateLabel(x))}<span class="name">${x.title}</span>${c.total ? `<span class="cnt">${c.done}/${c.total}</span>` : ''}${x.state === 'needs' ? `<span class="tag warning">${NEED[x.need]}</span>` : ''}</div>`;
      }
      function cardRow(id, kind) {
        const x = byId[id],
          c = count(x);
        return `<div class="scard" data-open="${id}" role="button" tabindex="0"><span class="kind" title="${kind === 'new' ? '新建' : '转给'}">${kind === 'new' ? PLUS : FWD}</span>${glyph(x.state, stateLabel(x))}<span class="name">${x.title}</span>${c.total ? `<span class="cnt">${c.done}/${c.total}</span>` : ''}${x.state === 'needs' ? `<span class="tag warning">${NEED[x.need]}</span>` : ''}</div>`;
      }
      function bubble(text, { up = [], down = [] } = {}) {
        if (links === 'inner') {
          const top =
            up.length > 1
              ? `<div class="ilink up" data-pop role="button" tabindex="0" aria-expanded="${pop}">${CURVE_UP}<span class="verb">转给</span><span class="name">${up.length} 个会话</span>${ic('chev', 's14')}</div>${pop ? `<div class="igroup">${up.map((id) => innerRow(id, '')).join('')}</div>` : ''}`
              : up.map((id) => innerRow(id, 'up')).join('');
          return `<div class="bubble">${top ? `<div class="iband top">${top}</div>` : ''}<div>${text}</div>${down.length ? `<div class="iband bottom">${down.map((id) => innerRow(id, 'down')).join('')}</div>` : ''}</div>`;
        }
        if (links === 'card') {
          const rows = [
            ...up.map((id) => cardRow(id, 'fwd')),
            ...down.map((id) => cardRow(id, 'new')),
          ];
          return `<div class="bubble"><div>${text}</div>${rows.length ? `<div class="cards">${rows.join('')}</div>` : ''}</div>`;
        }
        if (links === 'outer') {
          const top =
            up.length > 1
              ? `<div class="slink up" data-pop role="button" tabindex="0" aria-expanded="${pop}">${CURVE_UP}<span class="verb">转给</span><span class="name">${up.length} 个会话</span></div>${pop ? `<div class="slpop">${up.map((id) => linkRow(id, '', '')).join('')}</div>` : ''}`
              : up.map((id) => linkRow(id, 'up', '回复给')).join('');
          return `${top}<div class="bubble">${text}</div>${down.map((id) => linkRow(id, 'down', '新建')).join('')}`;
        }
        return `<div class="bubble">${text}</div>`;
      }
      function chat() {
        return `<div class="msgs">
    <div class="m me"><div><div class="bubble">Safari 上导出按钮点了没反应，帮我修一下，带回归测试。</div></div></div>
    <div class="m"><span class="ava">T</span><div><div class="who">Tobs · 13:01</div>${bubble('好，我开了一个 Assignment 去修，修好会附截图。', { down: ['a1'] })}</div></div>
    <div class="m me"><div><div class="bubble">发布说明里「语音输入」算亮点。另外虚拟滚动记得录前后对比。</div></div></div>
    <div class="m"><span class="ava">T</span><div><div class="who">Tobs · 13:10</div>${bubble('两件事都转过去了：发布说明按亮点写，虚拟滚动那边会附录屏。', { up: ['a2', 'a3'] })}</div></div>
    <div class="m"><span class="ava">T</span><div><div class="who">Tobs · 13:14</div>${bubble('发布说明的 Assignment 又问了一句：亮点要放几条？我先让它放 3 条。', { up: ['a2'] })}</div></div>
  </div>
  <div class="composer">给 Tobs 发消息…<span style="flex:1"></span>${ic('send')}</div>`;
      }
      function render() {
        document.documentElement.dataset.theme = theme;
        const s = selected ? byId[selected] : null;
        const drill = variant === 'C';
        const asideOpen = !drill && s;
        const sessionsPanel =
          drill && s
            ? `<section class="panel sessions" aria-label="会话详情">${detail(s, { drill: true })}</section>`
            : `<section class="panel sessions" aria-label="会话"><div class="ph"><span class="t">会话</span><span class="chip">Tobs</span><span class="sp"></span><button class="ib" aria-label="视图">${ic('menu')}</button><button class="ib" aria-label="隐藏">${ic('x')}</button></div><div class="body">${sessionsList()}</div></section>`;
        document.getElementById('root').innerHTML = `
  <div class="app">
    <nav class="rail"><h4>私聊</h4>
      <div class="nav sel"><span class="ava">T</span>Tobs</div>
      <div class="nav"><span class="ava" style="background:#7c3aed">R</span>Reviewer</div>
      <h4>群组</h4><div class="nav"># 发布小组</div><div class="nav"># 官网</div></nav>
    <div class="ws">
      <section class="panel msg" aria-label="消息">
        <div class="ph"><span class="ava">T</span><span class="t">Tobs</span><span class="chip">${ic('sessions', 's14')}3 个进行中 · 2 个需要你</span><span class="sp"></span><button class="ib" aria-label="成员">${ic('users')}</button></div>
        <div class="split">
          <div class="conv">${chat()}</div>
          ${asideOpen ? `<div class="divider" role="separator" aria-orientation="vertical"></div><aside class="aside" aria-label="会话详情">${detail(s)}</aside>` : ''}
        </div>
      </section>
      ${sessionsPanel}
    </div>
  </div>
  <div class="switch" role="toolbar" aria-label="Prototype">
    ${['A', 'B', 'C'].map((v) => `<button class="${v === variant ? 'on' : ''}" data-variant="${v}">${{ A: 'A 列表行 + 消息内详情', B: 'B 卡片 + 进度条', C: 'C 面板内下钻' }[v]}</button>`).join('')}
    <span class="sepv"></span>
    ${[
      ['inner', '链接：气泡内'],
      ['card', '链接：卡片'],
      ['outer', '链接：气泡外'],
      ['off', '链接：关'],
    ]
      .map(([m, l]) => `<button data-links="${m}" class="${links === m ? 'on' : ''}">${l}</button>`)
      .join('')}
    <button data-theme-toggle>${theme === 'light' ? '深色' : '浅色'}</button>
  </div>`;
      }
      document.addEventListener('click', (e) => {
        const t = e.target.closest(
          '[data-open],[data-close],[data-back],[data-variant],[data-theme-toggle],[data-links],[data-pop]',
        );
        if (!t) return;
        if (t.dataset.open) selected = t.dataset.open;
        if (t.hasAttribute('data-close') || t.hasAttribute('data-back')) selected = null;
        if (t.dataset.variant) variant = t.dataset.variant;
        if (t.dataset.links) links = t.dataset.links;
        if (t.hasAttribute('data-pop')) pop = !pop;
        if (t.hasAttribute('data-theme-toggle')) theme = theme === 'light' ? 'dark' : 'light';
        const q = new URLSearchParams({
          variant,
          theme,
          open: selected || 'none',
          links,
        });
        history.replaceState(null, '', '?' + q);
        render();
      });
      render();
    </script>
  </body>
</html>
