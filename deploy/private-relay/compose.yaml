services:
  relay:
    build: .
    image: tobs-relay:local
    restart: unless-stopped
    ports:
      - '${RELAY_BIND_ADDRESS:+${RELAY_BIND_ADDRESS}:}80:8080'
      - '${RELAY_BIND_ADDRESS:+${RELAY_BIND_ADDRESS}:}443:8443'
    volumes:
      - relay-data:/data
      - ./hosts:/run/relay-hosts:ro
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Run tobs-relay setup first}
      RELAY_BOOTSTRAP: ${RELAY_BOOTSTRAP:-}
      RELAY_HOST_KEYS_FILE: /run/relay-hosts/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  relay-data:
