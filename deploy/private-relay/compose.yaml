services:
  relay:
    build: .
    image: tobs-relay:local
    restart: unless-stopped
    ports:
      - '${RELAY_BIND_ADDRESS:+${RELAY_BIND_ADDRESS}:}80:80'
      - '${RELAY_BIND_ADDRESS:+${RELAY_BIND_ADDRESS}:}443:443'
    volumes:
      - relay-data:/data
      - ./hosts:/run/relay-hosts:ro
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Run tobs-relay setup first}
      RELAY_BOOTSTRAP: ${RELAY_BOOTSTRAP:?Run tobs-relay setup first}
      RELAY_HOST_KEYS_FILE: /run/relay-hosts/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
volumes:
  relay-data:
