apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.localcomputervideo'
version = '0.1.0'

android {
  namespace 'expo.modules.localcomputervideo'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

def cameraxVersion = '1.6.0'

dependencies {
  // M144, source 30d5e63ae91da483e06577b5c35ee91cc5e5c3db. No vendor servers.
  implementation 'io.github.webrtc-sdk:android:144.7559.15'
  // Same CameraX line as expo-camera, so Gradle resolves one capture stack.
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  testImplementation 'junit:junit:4.13.2'
}
