buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.materialtabrow'
version = '0.1.0'

android {
  namespace 'expo.modules.materialtabrow'
  defaultConfig { versionCode 1; versionName '0.1.0' }
  buildFeatures { compose true }
}

dependencies {
  // An Expo UI extension: the view renders inside `<Host>` and takes its Material theme.
  if (findProject(':expo-ui') != null) {
    implementation project(':expo-ui')
  } else {
    implementation 'expo.modules.ui:expo.modules.ui:+'
  }
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
  testImplementation 'junit:junit:4.13.2'
}
